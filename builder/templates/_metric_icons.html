{% macro metric_icon(kind) %}
{%- if kind == 'vpi' -%}
<svg class="metric-mini-icon" viewBox="0 0 40 40" fill="none">
  <rect x="9" y="9" width="22" height="22" rx="5" transform="rotate(45 20 20)" stroke="currentColor" stroke-width="2"/>
  <path d="M11,25 L16,18 L19,21 L23,14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12,27 L28,12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M20,12 L28,12 L28,20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{%- elif kind == 'dmi' -%}
<svg class="metric-mini-icon" viewBox="0 0 40 40" fill="none">
  <rect x="9" y="9" width="22" height="22" rx="5" transform="rotate(45 20 20)" stroke="currentColor" stroke-width="2"/>
  <path d="M12,15 L16,20 L20,14 L28,27" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20,27 L28,27 L28,19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{%- elif kind == 'er' -%}
<svg class="metric-mini-icon" viewBox="0 0 40 40" fill="none">
  <circle cx="20" cy="20" r="15" stroke="currentColor" stroke-width="2"/>
  <path d="M12,24 L16,18 L19,21 L24,13 L29,24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11,15 A12,12 0 0 1 29,15" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.5 2.5" stroke-linecap="round"/>
  <path d="M11,17 L20,15 L29,17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11" cy="17" r="1.6" fill="currentColor"/>
  <circle cx="20" cy="15" r="1.6" fill="currentColor"/>
  <circle cx="29" cy="17" r="1.6" fill="currentColor"/>
</svg>
{%- endif -%}
{% endmacro %}
