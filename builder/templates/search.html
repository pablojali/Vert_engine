{% extends "base.html" %}

{% block title %}{{ t.search_title }} — Vertical Trail Labs{% endblock %}

{% block content %}

  <h1>{{ t.search_title }}</h1>
  <input type="search" id="search-input" placeholder="{{ t.search_placeholder }}" autofocus>
  <ul id="search-results" class="search-results"></ul>
</section>
{% endblock %}
