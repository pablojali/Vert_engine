{% extends "base.html" %}

{% block title %}{{ t.races_title }} — Vertical Trail Labs{% endblock %}

{% block content %}
<section class="homepage-section">
  <h1>{{ t.races_title }}</h1>
  <ul class="race-grid">
    {% for r in races %}
    <li class="race-card">
      <a href="{{ r.url }}">
        {% if r.hero_image %}<img src="{{ r.hero_image }}" alt="" loading="lazy">{% endif %}
        <span class="race-card-name">{{ r.name }}</span>
        <span class="race-card-meta">{{ r.year }} · {{ r.distance_km|round(1) }} km</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
